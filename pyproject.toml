[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-archiver"
version = "0.1.0"
description = "把邮件里的中国电子发票自动下载、重命名、按月归档 / Auto-archive Chinese e-invoices from email"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
invoice-archiver = "invoice_archiver.cli:main"

[tool.setuptools]
packages = ["invoice_archiver"]
